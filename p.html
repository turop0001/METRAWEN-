<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Предложение METRAWEN</title>
<meta property="og:title" content="Коммерческое предложение METRAWEN">
<meta property="og:description" content="Состав работ, сроки и этапы оплаты под ваш проект">
<meta property="og:image" content="https://metrawen.com/chat-logo.png">
<meta name="theme-color" content="#121110">
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#121110;--card:#1a1916;--card2:#211f1b;--line:rgba(196,161,101,.22);--hair:rgba(255,255,255,.08);--text:#f2ede4;--dim:#b9b2a5;--faint:#857e72;--gold:#C4A165;--gold2:#D9BC86;--ok:#A9BC85;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--gold2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid var(--hair)}
.logo{font-weight:500;letter-spacing:.32em;font-size:17px;color:var(--text);text-decoration:none}
.top small{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#151411;font:600 15px var(--sans);cursor:pointer;text-decoration:none;transition:background .2s,transform .2s}
.btn:hover{background:var(--gold2);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--gold2)}
.btn.ghost:hover{background:rgba(196,161,101,.1)}
.btn.sm{padding:8px 14px;font-size:13px}
.hero{padding:56px 0 34px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(30px,4.6vw,50px);line-height:1.1;letter-spacing:-.02em;margin:14px 0 22px;font-weight:600;max-width:20ch}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--hair);border-radius:999px;font-size:13px;color:var(--dim);background:rgba(255,255,255,.02)}
.chip b{color:var(--text);font-weight:600}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.grid{display:grid;gap:28px;padding-bottom:60px}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.sec{margin-top:34px}
.sec h2{font-size:13px;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 14px;display:flex;gap:12px;align-items:center}
.sec h2 i{font-style:normal;color:var(--gold)}
.story{display:grid;gap:14px}
@media(min-width:720px){.story{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:22px}
.card h3{margin:0 0 8px;font-size:16px;font-weight:600}
.card p{margin:0;color:var(--dim);font-size:15px;white-space:pre-line}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:start;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px 20px}
.item b{font-weight:600}.item p{grid-column:1;margin:0;color:var(--dim);font-size:14px}
.item .pr{font-family:var(--mono);font-weight:500;white-space:nowrap;text-align:right}
.item .dy{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:right}
.addon{cursor:pointer;transition:border-color .2s,background .2s}
.addon:hover{border-color:var(--line)}
.addon.on{border-color:rgba(196,161,101,.6);background:rgba(196,161,101,.07)}
.addon .tg{display:inline-flex;align-items:center;gap:10px}
.sw{flex:none;width:36px;height:20px;border-radius:999px;background:#3a352c;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#f2ede4;transition:left .2s}
.addon.on .sw{background:var(--gold)}.addon.on .sw::after{left:19px}
.sum{position:sticky;top:20px;background:linear-gradient(180deg,#221f1a,#191814);border:1px solid var(--line);border-radius:22px;padding:24px}
.sum .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sum .tot{font-size:38px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px}
.sum .sub{color:var(--dim);font-size:14px}
.stages{margin:20px 0;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--hair)}
.stage{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair);font-size:14px}
.stage .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--gold)}
.stage.paid .n{background:var(--ok);border-color:var(--ok);color:#151411}
.stage small{display:block;color:var(--faint);font-size:12px}
.stage .am{font-family:var(--mono)}
.cta{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--faint);margin-top:12px;line-height:1.5}
.done{padding:12px 14px;border-radius:12px;background:rgba(169,188,133,.1);border:1px solid rgba(169,188,133,.35);color:var(--ok);font-size:14px}
.warn{padding:12px 14px;border-radius:12px;background:rgba(196,161,101,.08);border:1px solid var(--line);color:var(--gold2);font-size:14px;margin-bottom:12px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.steps{display:grid;gap:10px;counter-reset:s}
@media(min-width:720px){.steps{grid-template-columns:repeat(4,1fr)}}
.steps div{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px;font-size:14px;color:var(--dim)}
.steps div b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.steps div::before{counter-increment:s;content:"0" counter(s);font-family:var(--mono);color:var(--gold);font-size:12px;display:block;margin-bottom:8px}
.foot{border-top:1px solid var(--hair);padding:26px 0 60px;color:var(--faint);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.state{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--gold)}
.mbar{display:none}
@media(max-width:959px){.top small{display:none}.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(18,17,16,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}.mbar b{font-size:20px}.mbar small{display:block;color:var(--faint);font-size:12px}body{padding-bottom:84px}}
@media print{.mbar{display:none!important}}
@media print{
  :root{--bg:#fff;--card:#fff;--card2:#fff;--text:#151411;--dim:#3d3a35;--faint:#6f6a62;--hair:#ddd6c8;--line:#c4a165}
  .btn,.noprint{display:none!important}.sum{position:static;background:#fff}
  body{font-size:13px}.hero{padding:20px 0}.grid{grid-template-columns:1fr}
  .card,.item,.sum,.steps div{break-inside:avoid}
  .addon:not(.on){display:none}
}
</style>
</head>
<body>
<div id="app"><div class="state">…</div></div>
<script>
(function(){
  var id=(location.pathname.match(/\/p\/([a-z0-9]+)/)||[])[1]||new URLSearchParams(location.search).get('id')||'';
  var key='';try{key=localStorage.getItem('mw_kp_key')||''}catch(e){}
  var app=document.getElementById('app');
  function el(t,c,x){var d=document.createElement(t);if(c)d.className=c;if(x!=null)d.textContent=x;return d}
  function fmt(n,cur){n=Number(n||0);return cur==='RUB'?n.toLocaleString('ru-RU')+' ₽':'$'+n.toLocaleString('en-US')}
  fetch('/api/kp?id='+encodeURIComponent(id),{headers:key?{'x-kp-key':key}:{}}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){app.innerHTML='<div class="state">Предложение не найдено или ещё не опубликовано.<br>Proposal not found.</div>';return}
    render(j.kp,!!j.url);
  }).catch(function(){app.innerHTML='<div class="state">Ошибка загрузки. Обновите страницу.</div>'});

  function render(kp,admin){
    var ru=kp.lang!=='en';document.documentElement.lang=ru?'ru':'en';
    var L=ru?{kp:'Коммерческое предложение',for:'Для',valid:'Действует до',days:'раб. дней на работу',mgr:'ваш менеджер',sit:'Ваша ситуация',sol:'Что мы сделаем',res:'Что изменится',scope:'Состав работ',add:'Дополнительно, по желанию',addHint:'Нажмите, чтобы добавить в расчёт',demo:'Пример похожего проекта',demoBtn:'Открыть пример',how:'Как мы работаем',total:'Итого',term:'Срок',st:['При старте','После показа рабочей версии','При сдаче результата'],accept:'Принять предложение',pay:'Оплатить',payNext:'Оплатить этап',paid:'Оплачено',accepted:'Предложение принято. Спасибо!',next:'Что дальше: менеджер свяжется с вами в течение рабочего дня, уточнит детали старта и пришлёт ссылку на первый платёж, если её ещё нет на этой странице.',noLink:'Ссылку на оплату пришлёт ваш менеджер в ближайшее время.',expired:'Срок действия предложения истёк. Напишите нам, и мы обновим расчёт.',ask:'Задать вопрос',pdf:'Сохранить PDF',note:'Цена фиксируется на срок действия предложения. Оплата этапами: вы не платите полностью за то, что ещё не увидели.',steps:[['Старт','Согласуем детали и вносим первый платёж'],['Работа','Делаем и показываем рабочую версию'],['Правки','Вносим ваши правки'],['Запуск','Сдаём результат и помогаем после запуска']],draft:'Черновик: клиент его не видит'}:
      {kp:'Commercial proposal',for:'For',valid:'Valid until',days:'working days to build',mgr:'your manager',sit:'Your situation',sol:'What we will build',res:'What changes for you',scope:'Scope of work',add:'Optional extras',addHint:'Tap to add to the total',demo:'A similar sample project',demoBtn:'Open sample',how:'How we work',total:'Total',term:'Timeline',st:['At kickoff','After the working demo','At handover'],accept:'Accept proposal',pay:'Pay',payNext:'Pay stage',paid:'Paid',accepted:'Proposal accepted. Thank you!',next:'Next: your manager will contact you within one working day to confirm kickoff details and send the first payment link if it is not on this page yet.',noLink:'Your manager will send the payment link shortly.',expired:'This proposal has expired. Message us and we will refresh it.',ask:'Ask a question',pdf:'Save PDF',note:'The price is fixed while the proposal is valid. Payment in stages: you never pay in full for something you have not seen.',steps:[['Kickoff','We agree the details and you make the first payment'],['Build','We build and show you a working version'],['Feedback','We apply your feedback'],['Launch','We hand over and support you after launch']],draft:'Draft: the client cannot see it'};
    document.title=(kp.title||L.kp)+' · METRAWEN';
    var cur=kp.currency, sched=kp.schedule&&kp.schedule.length===3?kp.schedule:[30,40,30];
    var sel={};(kp.acceptedAddons||[]).forEach(function(i){sel[i]=1});
    var accepted=kp.status==='accepted', expired=kp.validUntil&&new Date(kp.validUntil+'T23:59:59')<new Date()&&!accepted;
    var vd=kp.validUntil?new Date(kp.validUntil+'T00:00:00').toLocaleDateString(ru?'ru-RU':'en-US',{day:'numeric',month:'long',year:'numeric'}):'';
    var ask=ru?'https://t.me/Metrawen_bot?start=kp':'https://wa.me/66985955242';
    app.textContent='';
    var w=el('div','wrap');app.appendChild(w);
    var top=el('div','top');var lg=el('a','logo','METRAWEN');lg.href='/'+(ru?'ru/':'');top.appendChild(lg);
    var tr=el('div');tr.style.cssText='display:flex;gap:12px;align-items:center';tr.appendChild(el('small','',L.kp+' № '+kp.id.toUpperCase()));
    var pb=el('button','btn ghost sm noprint',L.pdf);pb.onclick=function(){window.print()};tr.appendChild(pb);top.appendChild(tr);w.appendChild(top);
    var h=el('div','hero');
    if(admin&&kp.status==='draft'){var dr=el('div','warn noprint',L.draft);h.appendChild(dr)}
    var who=[kp.client&&kp.client.name,kp.client&&kp.client.company].filter(Boolean).join(', ');
    h.appendChild(el('div','eyebrow',who?L.for+' '+who:L.kp));
    h.appendChild(el('h1','',kp.title||L.kp));
    var ch=el('div','chips');
    var maxDays=(kp.items||[]).reduce(function(a,x){return a+Number(x.days||0)},0);
    function chip(lbl,val,img){var c=el('span','chip');if(img){var i=el('img');i.src=img;i.alt='';c.appendChild(i)}c.appendChild(el('b','',val));c.appendChild(document.createTextNode(' '+lbl));ch.appendChild(c)}
    if(vd)chip('',L.valid+' '+vd);
    var dChip=el('span','chip');ch.appendChild(dChip);
    chip(L.mgr,kp.manager||(ru?'Елена':'Nicole'),ru?'/chat-ru.jpg':'/chat-en.jpg');
    h.appendChild(ch);w.appendChild(h);
    var g=el('div','grid');w.appendChild(g);var main=el('div');g.appendChild(main);var side=el('div');g.appendChild(side);
    function sec(n,t){var s=el('div','sec');var hh=el('h2');var i=el('i','',n);hh.appendChild(i);hh.appendChild(document.createTextNode(t));s.appendChild(hh);main.appendChild(s);return s}
    if(kp.situation||kp.solution||kp.result){var s0=sec('01',ru?'Задача и решение':'Goal and solution');var st=el('div','story');
      [[L.sit,kp.situation],[L.sol,kp.solution],[L.res,kp.result]].forEach(function(p){if(!p[1])return;var c=el('div','card');c.appendChild(el('h3','',p[0]));c.appendChild(el('p','',p[1]));st.appendChild(c)});s0.appendChild(st)}
    var s1=sec('02',L.scope);var its=el('div','items');(kp.items||[]).forEach(function(x){var r=el('div','item');var a=el('div');a.appendChild(el('b','',x.name));r.appendChild(a);r.appendChild(el('div','pr',fmt(x.price,cur)));if(x.desc)r.appendChild(el('p','',x.desc));if(x.days)r.appendChild(el('div','dy',x.days+' '+(ru?'дн.':'d')));its.appendChild(r)});s1.appendChild(its);
    if((kp.addons||[]).length){var s2=sec('03',L.add);var ad=el('div','items');
      kp.addons.forEach(function(x,i){var r=el('div','item addon'+(sel[i]?' on':''));r.setAttribute('role','switch');r.tabIndex=0;r.setAttribute('aria-checked',sel[i]?'true':'false');r.onkeydown=function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();r.onclick()}};var a=el('div','tg');a.appendChild(el('span','sw'));a.appendChild(el('b','',x.name));r.appendChild(a);r.appendChild(el('div','pr','+ '+fmt(x.price,cur)));if(x.desc)r.appendChild(el('p','',x.desc));if(x.days)r.appendChild(el('div','dy','+'+x.days+' '+(ru?'дн.':'d')));
        r.onclick=function(){if(accepted)return;if(sel[i])delete sel[i];else sel[i]=1;r.classList.toggle('on');r.setAttribute('aria-checked',sel[i]?'true':'false');calc()};ad.appendChild(r)});
      s2.appendChild(ad);if(!accepted)s2.appendChild(el('div','note noprint',L.addHint))}
    if(kp.demo&&kp.demo.url){var s3=sec('04',L.demo);var dc=el('div','card demo');dc.appendChild(el('p','',kp.demo.title||L.demo));var da=el('a','btn ghost sm',L.demoBtn);da.href=kp.demo.url;da.target='_blank';da.rel='noopener';dc.appendChild(da);s3.appendChild(dc)}
    var s4=sec('05',L.how);var sp=el('div','steps');L.steps.forEach(function(p){var d=el('div');d.appendChild(el('b','',p[0]));d.appendChild(document.createTextNode(p[1]));sp.appendChild(d)});s4.appendChild(sp);
    var sm=el('div','sum');side.appendChild(sm);
    var mb=el('div','mbar noprint');document.body.appendChild(mb);
    function calc(){
      var t=(kp.items||[]).reduce(function(a,x){return a+Number(x.price||0)},0),days=maxDays;
      Object.keys(sel).forEach(function(i){var a=kp.addons[i];if(a){t+=Number(a.price||0);days+=Number(a.days||0)}});
      dChip.textContent='';dChip.appendChild(el('b','',String(days)));dChip.appendChild(document.createTextNode(' '+L.days));
      sm.textContent='';
      if(expired)sm.appendChild(el('div','warn',L.expired));
      sm.appendChild(el('div','lbl',L.total));sm.appendChild(el('div','tot',fmt(t,cur)));sm.appendChild(el('div','sub',L.term+': '+days+' '+L.days));
      var sg=el('div','stages');var nextIdx=-1;
      sched.forEach(function(p,i){var paid=kp.paid&&kp.paid[i];if(!paid&&nextIdx<0)nextIdx=i;var r=el('div','stage'+(paid?' paid':''));r.appendChild(el('span','n',paid?'✓':String(i+1)));var tx=el('div');tx.appendChild(document.createTextNode(p+'% · '+L.st[i]));if(paid)tx.appendChild(el('small','',L.paid));r.appendChild(tx);r.appendChild(el('span','am',fmt(Math.round(t*p/100),cur)));sg.appendChild(r)});
      sm.appendChild(sg);
      var c=el('div','cta noprint');
      if(!accepted&&!expired){var b=el('button','btn',L.accept);b.onclick=function(){b.disabled=true;fetch('/api/kp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'accept',id:kp.id,addons:Object.keys(sel).map(Number)})}).then(function(r){return r.json()}).then(function(j){if(j.ok){accepted=true;kp.status='accepted';calc();document.querySelectorAll('.addon+.note').forEach(function(n){n.remove()})}else b.disabled=false}).catch(function(){b.disabled=false})};c.appendChild(b)}
      if(accepted){c.appendChild(el('div','done',L.accepted));c.appendChild(el('div','note',L.next));
        if(nextIdx>=0){var link=kp.payLinks&&kp.payLinks[nextIdx];if(link){var pa=el('a','btn',L.payNext+' '+(nextIdx+1)+': '+fmt(Math.round(t*sched[nextIdx]/100),cur));pa.href=link;pa.target='_blank';pa.rel='noopener';c.appendChild(pa)}else c.appendChild(el('div','note',L.noLink))}}
      var q=el('a','btn ghost',L.ask);q.href=ask;q.target='_blank';q.rel='noopener';c.appendChild(q);
      sm.appendChild(c);sm.appendChild(el('div','note',L.note));
      mb.textContent='';var ml=el('div');ml.appendChild(el('small','',L.total));ml.appendChild(el('b','',fmt(t,cur)));mb.appendChild(ml);var mbtn=el('button','btn sm',accepted?(ru?'К оплате':'To payment'):L.accept);mbtn.onclick=function(){sm.scrollIntoView({behavior:'smooth',block:'start'})};mb.appendChild(mbtn);
    }
    calc();
    var f=el('div','foot');f.appendChild(el('span','','METRAWEN · metrawen.com'));f.appendChild(el('span','',new Date(kp.created||Date.now()).toLocaleDateString(ru?'ru-RU':'en-US')));w.appendChild(f);
  }
})();
</script>
</body>
</html>
